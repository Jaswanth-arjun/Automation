<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in - Google Accounts</title>
  <style>
    body { font-family: Roboto, Arial, sans-serif; display: flex; justify-content: center; padding-top: 80px; }
    .card { width: 380px; border: 1px solid #dadce0; border-radius: 8px; padding: 36px; }
    input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #dadce0; border-radius: 4px; margin: 16px 0; }
    button { background: #1a73e8; color: #fff; border: 0; border-radius: 4px; padding: 10px 24px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:22px;font-weight:400;">Sign in</h1>
    <p style="color:#5f6368;font-size:14px;">Use your Google Account</p>
    <input id="identifier" name="identifier" type="email" aria-label="Email or phone" placeholder="Email or phone" />
    <div style="font-size:14px;color:#1a73e8;">Forgot email?</div>
    <div style="margin-top:28px;text-align:right;"><button type="button">Next</button></div>
  </div>
</body>
</html>
